services:
  frontend:
    restart: always

  backend:
    restart: always
    environment:
      APP_ENV: production

  worker:
    restart: always
    environment:
      APP_ENV: production

  nginx:
    restart: always

  postgres:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: always

  qdrant:
    restart: always
