[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-intelligence-agent"
version = "0.1.0"
description = "Production-oriented BOM intelligence and multi-agent RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "redis>=6,<7",
    "celery>=5.5,<6",
    "qdrant-client>=1.15,<2",
    "python-multipart>=0.0.20,<1",
    "xlrd>=2,<3",
    "xlwt>=1.3,<2",
    "pandas>=2.2,<3",
    "openai>=1.0,<2",
    "PyMuPDF>=1.27,<2",
    "langgraph>=0.6,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = [
    "frontend*",
    "infra*",
    "migrations*",
    "worker*",
    "tests*"
]
